<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" width="device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./register.css">
    <title>Register | Hospital Management</title>
</head>
<body>
    <div class="register-page">
        <div class="register-box">
            <div class="logo-area">
                <img src="./logo.png" alt="Hospital Logo" class="logo">
                <h2>Create Account</h2>
            </div>

            <form class="register-form" action="./php/register.php" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" placeholder="Enter first name" required>
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create password" required>
                </div>

                <button type="submit" class="btn-register">Register</button>

                <div class="extra-links">
                    <p>Already have an account? <a href="./index.php">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
